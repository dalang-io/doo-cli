[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doo-cli"
version = "1.0.0"
description = "CLI for the Odoo PaaS platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pyyaml>=6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
doo-cli = "odoo_paas_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["odoo_paas_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
